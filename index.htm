<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patent Semantic Search + KG</title>
  <script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #graph { width: 100%; height: 400px; border: 1px solid #ccc; margin-top: 20px; }
    #results { margin-top: 20px; }
    .patent {
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
    }
    .score {
      font-weight: bold;
      color: green;
    }
    #llm-response {
      background: #f9f9f9;
      padding: 15px;
      margin-top: 20px;
      white-space: pre-wrap;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Patent Semantic Search + Knowledge Graph</h1>
  <input id="queryInput" type="text" placeholder="Enter your problem/query" style="width: 70%;" />
  <button onclick="search()">Search</button>

  <div id="results"></div>

  <h2>LLM Response</h2>
  <pre id="llm-response">Results will appear here...</pre>

  <h2>Knowledge Graph</h2>
  <div id="graph"></div>

  <script>
    let cy;

    function search() {
      const query = document.getElementById('queryInput').value.trim();
      if (!query) {
        alert('Please enter a query');
        return;
      }

      fetch('/api/query', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ query })
      })
      .then(res => res.json())
      .then(data => {
        displayResults(data.top_matches);
        displayLLMResponse(data.llm_response);
        renderGraph(data.graph);
      })
      .catch(err => {
        console.error(err);
        alert('Error during search');
      });
    }

    function displayResults(matches) {
      const container = document.getElementById('results');
      if (!matches.length) {
        container.innerHTML = '<p>No matches found.</p>';
        return;
      }
      container.innerHTML = '<h2>Top Matching Patents</h2>';
      matches.forEach((m, i) => {
        const div = document.createElement('div');
        div.className = 'patent';
        div.innerHTML = `<div><span class="score">#${i+1} (Score: ${m.score.toFixed(4)})</span> - <strong>${m.title}</strong></div>
                         <div><em>Domain:</em> ${m.domain}</div>
                         <div>${m.abstract.length > 300 ? m.abstract.slice(0,300) + '...' : m.abstract}</div>`;
        container.appendChild(div);
      });
    }

    function displayLLMResponse(response) {
      const pre = document.getElementById('llm-response');
      pre.textContent = JSON.stringify(response, null, 2);
    }

    function renderGraph(graph) {
      if (cy) {
        cy.destroy();
      }
      cy = cytoscape({
        container: document.getElementById('graph'),
        elements: {
          nodes: graph.nodes,
          edges: graph.edges
        },
        style: [
          {
            selector: 'node',
            style: {
              'label': 'data(label)',
              'background-color': '#0074D9',
              'color': '#fff',
              'text-valign': 'center',
              'text-halign': 'center',
              'width': 'label',
              'height': 'label',
              'padding': '10px',
              'font-size': 10,
              'shape': 'round-rectangle',
              'text-wrap': 'wrap',
              'text-max-width': 80
            }
          },
          {
            selector: 'edge',
            style: {
              'curve-style': 'bezier',
              'target-arrow-shape': 'triangle',
              'label': 'data(label)',
              'font-size': 8,
              'text-rotation': 'autorotate',
              'line-color': '#bbb',
              'target-arrow-color': '#bbb'
            }
          }
        ],
        layout: {
          name: 'cose',
          animate: true,
          padding: 30
        }
      });
    }
  </script>
</body>
</html>
