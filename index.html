<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patent Knowledge Graph Search</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- vis.js for graph visualization -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        /* Custom styles for vis.js graph */
        #graph-container {
            width: 100%;
            height: 600px;
            border-radius: 0.5rem;
            background-color: #1f2937; /* gray-800 */
            border: 1px solid #4b5563; /* gray-600 */
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for document list */
        #documents-list::-webkit-scrollbar {
            width: 8px;
        }
        #documents-list::-webkit-scrollbar-track {
            background: #1f2937; /* gray-800 */
        }
        #documents-list::-webkit-scrollbar-thumb {
            background: #4b5563; /* gray-600 */
            border-radius: 4px;
        }
        #documents-list::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* gray-500 */
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-200">

    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-2">Patent Knowledge Graph</h1>
            <p class="text-lg text-gray-400">Semantic Search Interface</p>
        </header>

        <!-- Search Form -->
        <div class="max-w-3xl mx-auto mb-8">
            <form id="search-form" class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="search-input" placeholder="Enter a technical concept, e.g., 'secure communication using quantum keys'"
                       class="flex-grow bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200">
                <button type="submit" id="search-button"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 flex items-center justify-center shadow-lg">
                    <svg id="search-icon" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <svg id="loading-spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="button-text">Search</span>
                </button>
            </form>
        </div>

        <!-- Results Area -->
        <div id="results-area" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left Column: Document List -->
                <div class="lg:col-span-1">
                    <h2 class="text-2xl font-semibold mb-4 text-white">Similar Documents</h2>
                    <div id="documents-list" class="space-y-4 max-h-[600px] overflow-y-auto pr-2">
                        <!-- Documents will be injected here by JavaScript -->
                    </div>
                </div>

                <!-- Right Column: Graph Visualization -->
                <div class="lg:col-span-2">
                    <h2 class="text-2xl font-semibold mb-4 text-white">Knowledge Graph Visualization</h2>
                    <div id="graph-container"></div>
                </div>
            </div>
        </div>
        
        <!-- Error Message Display -->
        <div id="error-message" class="max-w-3xl mx-auto mt-6 text-center text-red-400 font-medium"></div>
    </div>

    <script>
        // DOM Element References
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const searchIcon = document.getElementById('search-icon');
        const loadingSpinner = document.getElementById('loading-spinner');
        const buttonText = document.getElementById('button-text');
        const resultsArea = document.getElementById('results-area');
        const documentsList = document.getElementById('documents-list');
        const graphContainer = document.getElementById('graph-container');
        const errorMessage = document.getElementById('error-message');

        let network = null; // To hold the vis.js network instance

        // Function to toggle the loading state of the search button
        function setLoading(isLoading) {
            searchButton.disabled = isLoading;
            searchIcon.classList.toggle('hidden', isLoading);
            loadingSpinner.classList.toggle('hidden', !isLoading);
            buttonText.textContent = isLoading ? 'Searching...' : 'Search';
        }

        // Function to display an error message
        function displayError(message) {
            errorMessage.textContent = message;
            resultsArea.classList.add('hidden');
        }

        // Main function to handle form submission
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent default page reload
            const query = searchInput.value.trim();
            if (!query) {
                displayError("Please enter a search query.");
                return;
            }

            setLoading(true);
            errorMessage.textContent = '';
            resultsArea.classList.add('hidden');

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                console.error('Search error:', error);
                displayError(`An error occurred: ${error.message}`);
            } finally {
                setLoading(false);
            }
        });

        // Function to render the results (documents and graph)
        function displayResults(data) {
            if (!data || !data.documents || data.documents.length === 0) {
                displayError("No results found for your query.");
                return;
            }
            resultsArea.classList.remove('hidden');
            renderDocuments(data.documents, data.graph.nodes);
            renderGraph(data.graph);
        }

        // Function to render the list of similar documents
        function renderDocuments(documents, graphNodes) {
            documentsList.innerHTML = ''; // Clear previous results
            documents.forEach(doc => {
                // Find the corresponding graph node to get its element_id for highlighting
                const graphNode = graphNodes.find(n => n.patent_id === doc.id);
                const nodeId = graphNode ? graphNode.id : null;

                const docElement = document.createElement('div');
                docElement.className = 'bg-gray-800 p-4 rounded-lg border border-gray-700 hover:border-blue-500 cursor-pointer transition duration-200';
                docElement.dataset.nodeId = nodeId; // Store node ID for click events
                
                docElement.innerHTML = `
                    <h3 class="font-semibold text-white text-lg mb-1">${doc.title}</h3>
                    <p class="text-sm text-blue-400 mb-2">Similarity Score: ${doc.score}</p>
                    <p class="text-gray-400 text-sm">${doc.abstract.substring(0, 150)}...</p>
                `;
                documentsList.appendChild(docElement);
            });
        }

        // Function to render the knowledge graph using vis.js
        function renderGraph(graphData) {
            const options = {
                nodes: {
                    shape: 'dot',
                    size: 20,
                    font: {
                        size: 14,
                        color: '#ffffff'
                    },
                    borderWidth: 2,
                },
                edges: {
                    width: 1.5,
                    color: {
                        color: '#848484',
                        highlight: '#ffffff'
                    },
                    arrows: {
                        to: { enabled: true, scaleFactor: 0.5 }
                    },
                    // NEW: Configuration to display relationship labels
                    font: {
                        color: '#a0aec0', // gray-400
                        size: 12,
                        strokeWidth: 0,
                        align: 'middle'
                    }
                },
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -80,
                        centralGravity: 0.01,
                        springConstant: 0.08,
                        springLength: 200,
                        damping: 0.4,
                        avoidOverlap: 0.8
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200,
                    navigationButtons: true,
                    keyboard: true
                },
                groups: {
                    patent: { color: { background: '#f97316', border: '#fb923c' }, size: 30 }, // Orange
                    inventor: { color: { background: '#ec4899', border: '#f9a8d4' } }, // Pink
                    assignee: { color: { background: '#3b82f6', border: '#93c5fd' } }, // Blue
                    classification: { color: { background: '#14b8a6', border: '#5eead4' } }, // Teal
                    keyword: { color: { background: '#8b5cf6', border: '#c4b5fd' } }, // Violet
                    entity: { color: { background: '#6b7280', border: '#9ca3af' } }, // Gray
                    subdomain: { color: { background: '#84cc16', border: '#a3e635' } }, // Lime
                    domain: { color: { background: '#eab308', border: '#fde047' } }, // Yellow
                    usecase: { color: { background: '#ef4444', border: '#fca5a5' } } // Red
                }
            };
            
            const data = {
                nodes: new vis.DataSet(graphData.nodes),
                edges: new vis.DataSet(graphData.edges)
            };

            if (network) {
                network.destroy();
            }
            network = new vis.Network(graphContainer, data, options);
        }

        // Add event listener for clicking on a document to highlight the graph node
        documentsList.addEventListener('click', (e) => {
            const docElement = e.target.closest('[data-node-id]');
            if (docElement && network) {
                const nodeId = docElement.dataset.nodeId;
                if (nodeId) {
                    network.focus(nodeId, {
                        scale: 1.5,
                        animation: {
                            duration: 1000,
                            easingFunction: 'easeInOutQuad'
                        }
                    });
                    network.selectNodes([nodeId]);
                }
            }
        });

    </script>
</body>
</html>
